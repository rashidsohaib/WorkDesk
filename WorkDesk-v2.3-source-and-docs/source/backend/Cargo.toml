[package]
name = "workdesk-chrome"
version = "2.3.0"
description = "WorkDesk Chrome - privacy-first Gmail IMAP/SMTP desktop client that runs in a kiosk-mode Chrome"
authors = ["Rashid"]
edition = "2021"

[lib]
name = "workdesk_chrome"
path = "src/lib.rs"

[[bin]]
name = "workdesk-chrome"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
keyring = { version = "3", features = ["linux-native"] }
imap = { version = "3.0.0-alpha.15", default-features = false, features = ["native-tls"] }
imap-proto = "0.16"
nom = "7"
mailparse = "0.15"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "native-tls"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
opt-level = 3
strip = true
codegen-units = 4
